<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verification Desk · Ghost Protocol</title>
  <link rel="stylesheet" href="/desk.css">
  <script defer src="/desk.js"></script>
</head>
<body>
  <button class="skip-case" id="skip-case" type="button">Skip to case details</button>
  <header class="mast">
    <span class="brand"><i aria-hidden="true"></i> Ghost Protocol</span>
    <span class="environment">Local workspace</span>
  </header>
  <main>
    <div class="intro">
      <h1>Verification desk</h1>
      <p>Inspect deletion evidence and follow records that return.</p>
    </div>
    <div class="layout">
      <aside class="queue" aria-label="Case queue">
        <h2>Case queue <span id="case-count" aria-live="polite"></span></h2>
        <label class="sr-only" for="search">Find a case by reference</label>
        <input id="search" type="search" placeholder="Find a case">
        <label class="sr-only" for="filter">Filter case status</label>
        <select id="filter">
          <option value="all">All cases</option>
          <option value="review">Needs review</option>
          <option value="INCOMPLETE">Incomplete</option>
          <option value="VERIFIED_IN_SCOPE">Verified in scope</option>
          <option value="unverified">Not checked yet</option>
        </select>
        <nav id="cases" aria-label="Matching cases"></nav>
      </aside>
      <section class="dossier" id="case-detail" aria-label="Selected case" tabindex="-1">
        <div id="notice" role="status" aria-live="polite"></div>
        <div id="connection" role="status"></div>
        <div id="case-header"></div>
        <div id="case-body">Loading verification history…</div>
      </section>
    </div>
  </main>
</body>
</html>
